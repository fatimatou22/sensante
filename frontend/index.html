<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SénSante - Pre-diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-blue-600 text-white py-4 shadow-lg">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold">SénSanté</h1>
            <p class="text-blue-100 text-sm">Assistant pre-diagnostic medical</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div id="form-section" class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Symptomes du patient</h2>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Âge</label>
                    <input type="number" id="age"
                           class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                           placeholder="Ex: 28" min="0" max="120">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
                    <select id="sexe" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="F">Féminin</option>
                        <option value="M">Masculin</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
                    <input type="number" id="temperature" step="0.1"
                           class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                           placeholder="Ex: 38.5" min="35" max="42">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tension systolique</label>
                    <input type="number" id="tension_sys"
                           class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                           placeholder="Ex: 120" min="60" max="250">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Symptômes</label>
                    <div class="space-y-2">
                        <button type="button" id="btn-toux"
                                onclick="toggleSymptome('toux', 'btn-toux')"
                                class="w-full py-3 px-4 rounded-lg border-2 border-gray-300 text-gray-600 font-medium transition duration-200 text-left">
                            😮 Toux
                        </button>
                        <button type="button" id="btn-fatigue"
                                onclick="toggleSymptome('fatigue', 'btn-fatigue')"
                                class="w-full py-3 px-4 rounded-lg border-2 border-gray-300 text-gray-600 font-medium transition duration-200 text-left">
                            😓 Fatigue
                        </button>
                        <button type="button" id="btn-maux_tete"
                                onclick="toggleSymptome('maux_tete', 'btn-maux_tete')"
                                class="w-full py-3 px-4 rounded-lg border-2 border-gray-300 text-gray-600 font-medium transition duration-200 text-left">
                            😣 Maux de tête
                        </button>
                    </div>
                    <input type="hidden" id="toux" value="false">
                    <input type="hidden" id="fatigue" value="false">
                    <input type="hidden" id="maux_tete" value="false">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Région</label>
                    <select id="region" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="Dakar">Dakar</option>
                        <option value="Thies">Thiès</option>
                        <option value="Saint-Louis">Saint-Louis</option>
                        <option value="Ziguinchor">Ziguinchor</option>
                        <option value="Tambacounda">Tambacounda</option>
                        <option value="Kaolack">Kaolack</option>
                        <option value="Diourbel">Diourbel</option>
                        <option value="Fatick">Fatick</option>
                        <option value="Kolda">Kolda</option>
                        <option value="Matam">Matam</option>
                    </select>
                </div>

                <button onclick="diagnostiquer()" id="btn-diag"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
                    Diagnostiquer
                </button>
            </div>

            <div id="result-section">
                <div class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400">
                    <p class="text-4xl mb-3">🩺</p>
                    <p class="font-medium">Remplissez le formulaire</p>
                    <p class="text-sm mt-1">puis cliquez sur Diagnostiquer</p>
                </div>
            </div>

        </div>
    </main>

    <div class="max-w-4xl mx-auto px-4 pb-8" id="historique-section" style="display:none">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-3">📋 Historique des consultations</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="text-left py-2 px-3 text-gray-600">#</th>
                            <th class="text-left py-2 px-3 text-gray-600">Diagnostic</th>
                            <th class="text-left py-2 px-3 text-gray-600">Probabilité</th>
                            <th class="text-left py-2 px-3 text-gray-600">Heure</th>
                        </tr>
                    </thead>
                    <tbody id="historique-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="text-center text-gray-400 text-sm py-4">
        SénSante v0.3 - ESP/UCAD - L2 GLSI 2026
    </footer>

    <script>
        const API_URL = "http://localhost:8000";
        const historique = [];

        function toggleSymptome(id, btnId) {
            const input = document.getElementById(id);
            const btn = document.getElementById(btnId);
            const actif = input.value === "true";
            if (actif) {
                input.value = "false";
                btn.className = "w-full py-3 px-4 rounded-lg border-2 border-gray-300 text-gray-600 font-medium transition duration-200 text-left";
            } else {
                input.value = "true";
                btn.className = "w-full py-3 px-4 rounded-lg border-2 border-blue-500 bg-blue-50 text-blue-700 font-medium transition duration-200 text-left";
            }
        }

        async function diagnostiquer() {
            const patient = {
                age: parseInt(document.getElementById("age").value),
                sexe: document.getElementById("sexe").value,
                temperature: parseFloat(document.getElementById("temperature").value),
                tension_sys: parseInt(document.getElementById("tension_sys").value),
                toux: document.getElementById("toux").value === "true",
                fatigue: document.getElementById("fatigue").value === "true",
                maux_tete: document.getElementById("maux_tete").value === "true",
                region: document.getElementById("region").value
            };

            if (!patient.age || !patient.temperature || !patient.tension_sys) {
                afficherErreur("Veuillez remplir tous les champs.");
                return;
            }

            afficherChargement();

            try {
                const response = await fetch(API_URL + "/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patient)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail ? JSON.stringify(err.detail) : "Erreur serveur");
                }

                const resultat = await response.json();
                afficherResultat(resultat);

            } catch (error) {
                document.getElementById("result-section").innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                        <p class="text-4xl mb-3 text-center">🌐</p>
                        <p class="text-red-700 font-medium text-center">Connexion impossible</p>
                        <p class="text-red-500 text-sm mt-2 text-center">Vérifiez votre connexion 3G/WiFi</p>
                        <button onclick="diagnostiquer()"
                                class="w-full mt-4 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">
                            🔄 Réessayer
                        </button>
                    </div>`;
            }
        }

        function afficherChargement() {
            document.getElementById("result-section").innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6 text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-3"></div>
                    <p class="text-gray-500">Analyse en cours...</p>
                </div>`;
        }

        function afficherResultat(r) {
            const couleurs = {
                palu:      { bg: "bg-red-100",    text: "text-red-800",    badge: "bg-red-500" },
                paludisme: { bg: "bg-red-100",    text: "text-red-800",    badge: "bg-red-500" },
                grippe:    { bg: "bg-orange-100", text: "text-orange-800", badge: "bg-orange-500" },
                typh:      { bg: "bg-yellow-100", text: "text-yellow-800", badge: "bg-yellow-500" },
                typhoide:  { bg: "bg-yellow-100", text: "text-yellow-800", badge: "bg-yellow-500" },
                sain:      { bg: "bg-green-100",  text: "text-green-800",  badge: "bg-green-500" }
            };

            const icones = {
                palu:      "🦟",
                paludisme: "🦟",
                grippe:    "🤧",
                typh:      "⚠️",
                typhoide:  "⚠️",
                sain:      "✅"
            };

            const c = couleurs[r.diagnostic] || couleurs["sain"];
            const icone = icones[r.diagnostic] || "🩺";
            const pct = Math.round(r.probabilite * 100);

            document.getElementById("result-section").innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Résultat</h2>
                    <div class="${c.bg} rounded-lg p-4 mb-4">
                        <p class="text-sm text-gray-600">Diagnostic :</p>
                        <p class="text-2xl font-bold ${c.text} uppercase mt-1">
                            ${icone} ${r.diagnostic}
                        </p>
                    </div>
                    <div class="mb-4">
                        <div class="flex justify-between mb-1">
                            <span class="text-sm text-gray-600">Probabilité</span>
                            <span class="text-sm font-bold ${c.text}">${pct}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3">
                            <div class="${c.badge} h-3 rounded-full transition-all duration-500"
                                 style="width: ${pct}%"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full">
                            ${r.confiance}
                        </span>
                        <span class="text-sm text-gray-600">confiance</span>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-sm text-gray-700">${r.message}</p>
                    </div>
                    <button onclick="lireResultat('${r.diagnostic}', '${r.message}')"
                            class="w-full mt-3 py-2 bg-gray-100 rounded-lg text-gray-600 text-sm hover:bg-gray-200 transition">
                        🔊 Écouter le résultat
                    </button>
                    <div id="explication-zone" class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
                        <p class="text-sm text-purple-600 font-medium mb-2">💬 Explication (Llama 3)</p>
                        <p class="text-gray-500 text-sm animate-pulse">Génération en cours...</p>
                    </div>
                </div>`;

            ajouterHistorique(r, pct);
            demanderExplication(r);
        }

        async function demanderExplication(r) {
            const explainData = {
                diagnostic: r.diagnostic,
                probabilite: r.probabilite,
                age: parseInt(document.getElementById("age").value),
                sexe: document.getElementById("sexe").value,
                temperature: parseFloat(document.getElementById("temperature").value),
                region: document.getElementById("region").value
            };

            try {
                const response = await fetch(API_URL + "/explain", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(explainData)
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById("explication-zone").innerHTML = `
                        <p class="text-sm text-purple-600 font-medium mb-2">💬 Explication (Llama 3)</p>
                        <p class="text-gray-700 text-sm leading-relaxed">${result.explication}</p>`;
                }
            } catch (error) {
                document.getElementById("explication-zone").innerHTML = `
                    <p class="text-gray-400 text-sm">Explication non disponible.</p>`;
            }
        }

        function ajouterHistorique(r, pct) {
            const heure = new Date().toLocaleTimeString('fr-FR');
            historique.unshift({ diagnostic: r.diagnostic, probabilite: pct, heure: heure });
            document.getElementById("historique-section").style.display = "block";
            document.getElementById("historique-body").innerHTML = historique.map((c, i) => `
                <tr class="border-b border-gray-100">
                    <td class="py-2 px-3 text-gray-500">${i + 1}</td>
                    <td class="py-2 px-3 font-medium text-gray-700">${c.diagnostic}</td>
                    <td class="py-2 px-3 font-medium text-gray-700">${c.probabilite}%</td>
                    <td class="py-2 px-3 text-gray-500">${c.heure}</td>
                </tr>
            `).join('');
        }

        function lireResultat(diagnostic, message) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(
                    "Diagnostic : " + diagnostic + ". " + message
                );
                utterance.lang = 'fr-FR';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }

        function afficherErreur(msg) {
            document.getElementById("result-section").innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                    <p class="text-red-700 font-medium">${msg}</p>
                    <p class="text-red-500 text-sm mt-2">Vérifiez votre connexion et réessayez.</p>
                </div>`;
        }
    </script>

</body>
</html>
